name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Verify release manifest matches tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version_file="$(tr -d '[:space:]' < backend/VERSION)"
          manifest_version="$(jq -r '.version' RELEASE_MANIFEST.json)"
          if [[ "${version_file}" != "${tag}" ]]; then
            echo "::error::backend/VERSION (${version_file}) does not match tag ${tag}." >&2
            exit 1
          fi
          if [[ "${manifest_version}" != "${tag}" ]]; then
            echo "::error::RELEASE_MANIFEST.json version (${manifest_version}) does not match tag ${tag}. Run backend/scripts/release-prepare.sh ${tag} before tagging." >&2
            exit 1
          fi
          if ! jq -e --arg t "${tag}" '.releases[$t]' DIGESTS.lock > /dev/null; then
            echo "::error::DIGESTS.lock has no entry for ${tag}. Run backend/scripts/release-prepare.sh ${tag} before tagging." >&2
            exit 1
          fi
          echo "Release manifest and digest lock agree with tag ${tag}."

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set Reproducible Build Headers
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve FFmpeg base image reference
        run: |
          version="$(sed -n 's/^FFMPEG_VERSION := //p' mk/variables.mk | head -n 1 | tr -d '[:space:]')"
          test -n "${version}"
          echo "FFMPEG_BASE_IMAGE=ghcr.io/manugh/xg2g-ffmpeg:${version}" >> "$GITHUB_ENV"
          echo "FFmpeg base image: ghcr.io/manugh/xg2g-ffmpeg:${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --timeout 2h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published OCI manifest
        id: verify-image
        run: |
          verification="$(
            backend/scripts/release-verify-remote.sh \
              --version "${GITHUB_REF_NAME}" \
              --also-tag latest \
              --require-platform linux/amd64 \
              --require-platform linux/arm64 \
              --json
          )"
          digest="$(jq -r '.digest' <<<"${verification}")"
          test "${digest}" != "null"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified OCI release"
            echo
            echo "- Image: \`ghcr.io/manugh/xg2g@${digest}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- \`${GITHUB_REF_NAME}\` and \`latest\` resolve to the same digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json

      - name: Attest OCI manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/manugh/xg2g
          subject-digest: ${{ steps.verify-image.outputs.digest }}
          push-to-registry: true

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
          if [[ "${is_draft}" != "true" ]]; then
            echo "::error::Expected ${GITHUB_REF_NAME} to remain a draft until verification completed." >&2
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
