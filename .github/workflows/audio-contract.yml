name: Audio Contract

# Replays the ffmpeg argument vector the daemon really builds against a synthetic
# DVB-like fixture and asserts the audio contract on the output.
#
# Why a dedicated gate: on 2026-07-26 three deploys shipped without effect (or broke
# playback) because the only oracle was a person zapping the receiver and listening.
# Go tests cannot observe ffmpeg refusing an invalid -var_stream_map (exit 234), and
# they stayed green while production served 192k instead of 320k. This job closes both
# gaps in ~2 minutes, without a tuner and without a GPU.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/internal/infra/media/ffmpeg/**"
      - "backend/internal/domain/playbackplanner/**"
      - "backend/internal/domain/playbackprofile/**"
      - "backend/internal/pipeline/profiles/**"
      - "backend/internal/control/http/v3/intents/**"
      - "backend/scripts/smoke-live-audio.sh"
      - ".github/workflows/audio-contract.yml"
  # Deliberately not filtered by base branch. This repo stacks PRs (#734 targets
  # refactor/r5-1-guardrail-linter, not main), and every gate that filters on
  # `branches: [main]` silently skips those — which is how a red test and an
  # unformatted file travelled unnoticed on 2026-07-26. A pipeline change deserves
  # this gate wherever it is proposed.
  pull_request:
    paths:
      - "backend/internal/infra/media/ffmpeg/**"
      - "backend/internal/domain/playbackplanner/**"
      - "backend/internal/domain/playbackprofile/**"
      - "backend/internal/pipeline/profiles/**"
      - "backend/internal/control/http/v3/intents/**"
      - "backend/scripts/smoke-live-audio.sh"
      - ".github/workflows/audio-contract.yml"

permissions:
  contents: read

concurrency:
  group: repo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audio-contract:
    name: Audio Contract / ffmpeg replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      ARGVEC: ${{ github.workspace }}/argvec/live-args.txt

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
          # Matches ci.yml: cache restore has been flaky (tar exit code 2).
          cache: false

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1
          # The CPU AV1 path encodes with libsvtav1; without it the replay would fail
          # for a reason that has nothing to do with the audio contract.
          ffmpeg -hide_banner -encoders | grep -q libsvtav1 || {
            echo "❌ this ffmpeg build has no libsvtav1 encoder"
            exit 1
          }

      - name: Build the live argument vector from the real arg builder
        run: |
          set -euo pipefail
          cd backend
          # Dumping instead of committing a golden vector: a checked-in vector drifts
          # from the code, which is the failure mode this gate exists to prevent.
          XG2G_ARGVEC_DUMP="${ARGVEC}" go test ./internal/infra/media/ffmpeg/ \
            -run TestDumpLiveArgVector -count=1 -v
          echo "--- vector ($(wc -l <"${ARGVEC}") args):"
          tr '\n' ' ' <"${ARGVEC}"
          echo

      - name: Replay the vector and assert the audio contract
        run: |
          set -euo pipefail
          # Expect what the vector itself requested: this asserts that ffmpeg honored
          # the pipeline's own -b:a, and keeps the "is 320k the right number" question
          # where it belongs (the Go seam tests).
          expect_k="$(grep -A1 '^-b:a$' "${ARGVEC}" | tail -1 | tr -d 'k')"
          echo "vector requests ${expect_k} kbit/s audio"
          bash backend/scripts/smoke-live-audio.sh \
            --args-file "${ARGVEC}" \
            --no-hwaccel \
            --expect-audio-bitrate-k "${expect_k}" \
            --expect-audio-renditions 2

      - name: Negative control (the gate must be able to fail)
        run: |
          set -euo pipefail
          # A smoke test that cannot fail is decoration. Assert a deliberately wrong
          # bitrate and require a non-zero exit; today's regression was invisible
          # precisely because nothing in CI could go red.
          expect_k="$(grep -A1 '^-b:a$' "${ARGVEC}" | tail -1 | tr -d 'k')"
          wrong_k=$((expect_k / 2))
          if bash backend/scripts/smoke-live-audio.sh \
            --args-file "${ARGVEC}" \
            --no-hwaccel \
            --expect-audio-bitrate-k "${wrong_k}" \
            --expect-audio-renditions 2 >/dev/null 2>&1; then
            echo "❌ harness passed while asserting ${wrong_k} kbit/s — it is not measuring anything"
            exit 1
          fi
          echo "✅ harness fails as expected when the bitrate is wrong"
