name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    # This workflow emits a branch-protection-required check. It must run for
    # every PR; path filters would leave unmatched PRs permanently "Expected".

permissions:
  contents: read

concurrency:
  group: repo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-pr:
    name: CI / PR Gate (Fast & Deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: auto
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Token URL gate
        run: |
          set -euo pipefail
          if git grep -n -i -E '(\?|&)(token|access_token|auth|jwt|bearer)=' -- . ':!backend/vendor'; then
            echo "❌ denylisted auth-like query key found in URL parameters"
            exit 1
          fi
          echo "✅ token URL gate passed"


      - name: Set Reproducible Build Headers
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
          # Cache restore has been flaky (tar exit code 2). Disable to keep CI deterministic.
          cache: false
        env:
          GOTOOLCHAIN: auto

      - name: Verify Go toolchain policy
        run: ./backend/scripts/check-go-toolchain.sh

      - name: Verify modules
        run: |
          set -euo pipefail
          cd backend
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Install golangci-lint (built with runner Go)
        run: |
          set -euo pipefail
          cd backend
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          golangci-lint --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install check-jsonschema
        run: |
          set -euo pipefail
          python3 -m pip install --user check-jsonschema==0.34.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          check-jsonschema --version

      - name: Run PR gate bundle
        # The default PR gate is intentionally deterministic and must not
        # depend on optional ffmpeg/system-package availability.
        run: make ci-pr

  race-pr:
    name: CI / Race Detector (live concurrency packages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: auto
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
          cache: false
        env:
          GOTOOLCHAIN: auto

      - name: Install ffmpeg for full verification suite
        # Run 33599181411 stalled here for 21m37s on an unresponsive apt mirror,
        # burning the 25m job budget and cancelling an otherwise passing suite.
        # Slowest healthy install for this job is 89s; 5m leaves ~3x headroom.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=15 ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Run scoped race detector
        # Packages where the live transcode/session concurrency lives. These
        # are exactly the packages a fix to the session/ffmpeg/bus hot path
        # touches, and they were previously only covered by the nightly
        # full ./... -race run (ci-deep-scheduled.yml) — too late to block a
        # regression merging. Scoped + deterministic (no ffmpeg binary needed).
        run: make test-race-pr

      - name: Run Phase D verification suite
        run: |
          set -euo pipefail
          cd backend
          go test -count=1 -race ./internal/pipeline/lease/...
          go test -count=1 -race ./internal/app/bootstrap/... ./internal/domain/session/manager/... ./internal/domain/session/store/...
          go test -count=1 ./...
