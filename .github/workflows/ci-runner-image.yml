name: CI Runner Base Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/docker/Dockerfile.ci-runner"
      - ".github/workflows/ci-runner-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/docker/Dockerfile.ci-runner"
      - ".github/workflows/ci-runner-image.yml"

concurrency:
  group: ci-runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/manugh/xg2g-ci-runner

jobs:
  build:
    name: Build & Publish CI Runner Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.ci-runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-runner
          cache-to: type=gha,mode=max,scope=ci-runner
