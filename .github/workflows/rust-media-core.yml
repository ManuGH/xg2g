name: Rust Media Core

# The media core is a second build artifact, not a Go dependency. This gate keeps
# it honest on its own terms - formatted, lint-clean, tested, and buildable for
# every platform the runtime image targets - without the Go build knowing it
# exists.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: repo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: media-core

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Latest stable

      # rust-toolchain.toml pins the compiler, the components and the targets, so
      # there is nothing to choose here: whatever it names is what runs.
      - name: Show the pinned toolchain
        run: |
          set -euo pipefail
          cat rust-toolchain.toml
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # Latest stable
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            media-core/target
          key: rust-media-core-${{ runner.os }}-${{ hashFiles('media-core/Cargo.lock', 'media-core/rust-toolchain.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # Cargo.lock is committed, so a build that would have to change it is a
      # build whose inputs moved without anyone saying so.
      - name: Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

      # Two places name the compiler: this file, for cargo, and the Dockerfile's
      # base image for the stage that deliberately does not read it. Drift would
      # mean the image ships a binary built by a compiler no gate ever tested.
      - name: The image's Rust matches the pinned toolchain
        working-directory: .
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' media-core/rust-toolchain.toml)"
          image="$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' Dockerfile)"
          test -n "$pinned" && test -n "$image"
          echo "rust-toolchain.toml: $pinned   Dockerfile: $image"
          test "$pinned" = "$image" || {
            echo "the toolchain file pins $pinned but the image builds with $image"
            exit 1
          }

  # The one gate that runs both languages against each other.
  #
  # Everything else here is about the crate on its own terms, and everything in
  # the Go CI is about Go on its own. The differential lives in between: the Go
  # tests that speak to a real media core skip themselves when
  # XG2G_MEDIA_CORE_BIN is unset, so without a job that sets it they are not a
  # gate at all - they are a thing somebody can run by hand and did, once. This
  # workflow owns the cross-language artefact, so it owns proving it.
  #
  # The whole package, not a -run selection. A regex here would decide today
  # which tests count, and the real-core test added next month would quietly not
  # be one of them.
  differential:
    name: Go/Rust differential
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Latest stable

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # Latest stable
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            media-core/target
          key: rust-media-core-${{ runner.os }}-${{ hashFiles('media-core/Cargo.lock', 'media-core/rust-toolchain.toml') }}

      - name: Build native media core
        working-directory: media-core
        run: cargo build --release --locked

      # Twice: once as it is, once under the race detector. The shadow's whole
      # claim is about what a worker goroutine does while an ingest is running,
      # and a differential that never ran with -race would be checking the
      # answers and not the concurrency that produced them.
      - name: Prove real Go/Rust differential
        working-directory: backend
        env:
          XG2G_MEDIA_CORE_BIN: ${{ github.workspace }}/media-core/target/release/xg2g-media-core
        run: |
          set -euo pipefail
          # A core that cannot be started makes every test here skip, and a
          # skipped differential reads exactly like a passing one.
          test -x "$XG2G_MEDIA_CORE_BIN"
          "$XG2G_MEDIA_CORE_BIN"

          go test -count=1 \
            ./internal/stream/ingest/remotecore

          go test -race -count=1 \
            ./internal/stream/ingest/remotecore

  build:
    name: Release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Native on this runner; the cross packages are the same toolchain.
            packages: gcc-x86-64-linux-gnu libc6-dev-amd64-cross
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
            linker_bin: x86_64-linux-gnu-gcc
          - target: aarch64-unknown-linux-gnu
            # The compiler alone is not enough: linking needs the target's libc
            # start files, and without them ld fails on Scrt1.o and crti.o.
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker_bin: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Latest stable

      - name: Install the cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          export ${{ matrix.linker_env }}=${{ matrix.linker_bin }}
          cargo build --release --locked --target ${{ matrix.target }}

      # A binary that exists but is built for the wrong machine would pass every
      # step above and fail only in the image.
      - name: The binary is for the target it names
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/xg2g-media-core"
          test -x "$bin"
          file "$bin"
          case "${{ matrix.target }}" in
            x86_64-*)  file "$bin" | grep -q "x86-64" ;;
            aarch64-*) file "$bin" | grep -q "aarch64" ;;
          esac

  image:
    name: Runtime image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x86-64
          - platform: linux/arm64
            arch: aarch64
    # The image build reads the whole repository, not just the crate.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Latest stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Read from the same place the Makefile reads it, so the base image cannot
      # drift away from what the rest of the build expects.
      - name: Resolve the FFmpeg base
        id: ffmpeg
        run: |
          set -euo pipefail
          version="$(sed -n 's/^FFMPEG_VERSION[[:space:]]*:=[[:space:]]*//p' mk/variables.mk | head -1)"
          test -n "$version"
          echo "base=ghcr.io/manugh/xg2g-ffmpeg:${version}" >> "$GITHUB_OUTPUT"

      - name: Build the runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            FFMPEG_BASE_IMAGE=${{ steps.ffmpeg.outputs.base }}
          tags: xg2g-image-check:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pulled out of the image and inspected on the runner, because the runtime
      # image is slim and what is or is not installed inside it should not decide
      # whether this gate can answer.
      - name: Both binaries are present and built for this platform
        run: |
          set -euo pipefail
          img="xg2g-image-check:${{ github.sha }}"
          cid="$(docker create "$img")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          docker cp "$cid:/usr/local/bin/xg2g" ./xg2g.bin
          docker cp "$cid:/usr/local/bin/xg2g-media-core" ./media-core.bin
          file ./xg2g.bin ./media-core.bin

          file ./xg2g.bin          | grep -q "${{ matrix.arch }}"
          file ./media-core.bin    | grep -q "${{ matrix.arch }}"

          # Rust arrived as a separate artifact, not as a library linked into the
          # daemon. If that ever stops being true, the Go binary stops being static
          # and this is where it shows.
          file ./xg2g.bin | grep -q "statically linked"

      # An ELF header is a claim about a binary; running it is the check. A wrong
      # target architecture produced a header that looked right in every other
      # step and an image that could not exec its own entrypoint, so both
      # binaries are started here rather than only inspected.
      - name: Both binaries run in the image and exit cleanly
        run: |
          set -euo pipefail
          img="xg2g-image-check:${{ github.sha }}"
          docker run --rm --entrypoint /usr/local/bin/xg2g-media-core "$img"
          docker run --rm --entrypoint /usr/local/bin/xg2g "$img" --version

      - name: The image still runs as the non-root service user
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint /bin/sh "xg2g-image-check:${{ github.sha }}" -c 'id -u')"
          test "$uid" = "10001" || { echo "image runs as uid $uid, want 10001"; exit 1; }
