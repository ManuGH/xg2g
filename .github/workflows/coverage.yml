name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**/*.go"
      - "backend/go.mod"
      - "backend/go.sum"
      - "mk/**"
      - ".github/workflows/coverage.yml"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "backend/**/*.go"
      - "backend/go.mod"
      - "backend/go.sum"
      - "mk/**"
      - ".github/workflows/coverage.yml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: repo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-coverage:
    name: Go Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: auto
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install ffmpeg
        # Bounds an apt-mirror stall so it cannot consume the 35m job budget.
        # Slowest install observed for this job is 94s; 5m leaves ~3x headroom.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=15 ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Run coverage
        id: coverage
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd backend
          go test ./... -count=1 -timeout=20m \
            -covermode=atomic \
            -coverprofile=../artifacts/coverage.out \
            -coverpkg=./...

          minimum="$(make --no-print-directory -s -C .. print-coverage-threshold)"
          gate_output="$(
            GO_BIN="$(command -v go)" ./scripts/ci/enforce-coverage.sh \
              ../artifacts/coverage.out \
              ../artifacts/coverage.filtered.out \
              ../artifacts/coverage.txt \
              "${minimum}"
          )"
          printf '%s\n' "${gate_output}"
          total="$(printf '%s\n' "${gate_output}" | awk -F= '/^coverage_total=/ { print $2 }')"
          if [[ -z "${total}" ]]; then
            echo "failed to extract total coverage" >&2
            exit 1
          fi
          go tool cover -html=../artifacts/coverage.filtered.out -o ../artifacts/coverage.html
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage Report"
            echo
            echo "- Total Go coverage: **${total}%**"
            echo "- Required minimum: **${minimum}%**"
            echo "- Artifact: \`coverage-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: coverage-report
          path: |
            artifacts/coverage.out
            artifacts/coverage.filtered.out
            artifacts/coverage.txt
            artifacts/coverage.html
          retention-days: 14
