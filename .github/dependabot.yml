version: 2
updates:
  # Go dependencies (Bundle everything into one PR)
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "04:00"
    groups:
      # Filter: Bundle all go modules updates into one "go-deps" PR
      go-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # WebUI dependencies (Bundle everything into one PR)
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/webui"
      - "/backend/e2e/fixture-server"
    schedule:
      interval: "daily"
      time: "04:00"
    groups:
      # Filter: Bundle all npm updates into one "npm-deps" PR
      npm-deps:
        patterns:
          - "*"
    ignore:
      # typescript-eslint (latest: 8.65.0) declares peer typescript ">=4.8.4 <6.1.0".
      # Anything at or above 6.1 makes `npm ci` fail with ERESOLVE, so the whole
      # grouped PR becomes uninstallable. Lift this cap once typescript-eslint
      # ships a release that accepts the newer major.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions (Bundle everything into one PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    groups:
      # Filter: Bundle all action updates
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Container images used by the runtime and optional monitoring overlay.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
