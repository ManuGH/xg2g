<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xg2g Social Preview</title>
  <desc id="desc">xg2g - self-hosted streaming gateway for Enigma2 receivers delivering live TV, adaptive streaming, and DVR to browsers and native clients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050E12"/>
      <stop offset="0.5" stop-color="#0B222B"/>
      <stop offset="1" stop-color="#12313A"/>
    </linearGradient>
    <linearGradient id="signal" x1="120" y1="120" x2="1160" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D1A7"/>
      <stop offset="0.5" stop-color="#5FB9E9"/>
      <stop offset="1" stop-color="#FFB84D"/>
    </linearGradient>
    <linearGradient id="card-panel" x1="0" y1="0" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2B35" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#07181F" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1280" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="1080" cy="140" r="280" fill="#36D1A7" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="160" cy="540" r="240" fill="#FFB84D" fill-opacity="0.07" filter="url(#glow)"/>

  <!-- Signal Wave Line -->
  <path d="M60 480C220 380 340 400 480 460C620 520 740 540 880 470C1000 410 1120 320 1220 350" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Main Container Overlay -->
  <g filter="url(#shadow)">
    <rect x="56" y="56" width="1168" height="528" rx="24" fill="#07171E" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>

  <!-- Left Column: Branding & Positioning -->
  <g transform="translate(104, 108)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="232" height="38" rx="19" fill="#36D1A7" fill-opacity="0.14" stroke="#36D1A7" stroke-opacity="0.45"/>
    <circle cx="20" cy="19" r="5" fill="#36D1A7"/>
    <text x="36" y="24" fill="#8BE9D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="2">STREAMING GATEWAY</text>

    <!-- Title & Subtitle -->
    <text x="0" y="112" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-3">xg2g</text>
    <text x="0" y="164" fill="#FFF8EA" fill-opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Self-Hosted Enigma2 Gateway</text>
    
    <text x="0" y="212" fill="#C5D3D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Live TV, adaptive streaming, DVR and household access —</text>
    <text x="0" y="240" fill="#C5D3D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">delivered seamlessly to browsers and native clients.</text>

    <!-- Key Badges Grid -->
    <g transform="translate(0, 284)">
      <!-- Badge 1: Enigma2 TS -->
      <rect x="0" y="0" width="168" height="52" rx="14" fill="#112F39" stroke="#36D1A7" stroke-opacity="0.3"/>
      <text x="18" y="22" fill="#36D1A7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">SOURCE</text>
      <text x="18" y="40" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Enigma2 MPEG-TS</text>

      <!-- Badge 2: Delivery -->
      <rect x="180" y="0" width="168" height="52" rx="14" fill="#112F39" stroke="#5FB9E9" stroke-opacity="0.3"/>
      <text x="198" y="22" fill="#5FB9E9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">TARGET</text>
      <text x="198" y="40" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">HLS &amp; fMP4</text>

      <!-- Badge 3: Transcode -->
      <rect x="360" y="0" width="168" height="52" rx="14" fill="#112F39" stroke="#FFB84D" stroke-opacity="0.3"/>
      <text x="378" y="22" fill="#FFB84D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">HARDWARE</text>
      <text x="378" y="40" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">VAAPI &amp; NVENC</text>
    </g>
  </g>

  <!-- Right Column: Interactive Code & Architecture Panel -->
  <g transform="translate(680, 108)">
    <rect x="0" y="0" width="480" height="424" rx="20" fill="url(#card-panel)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="0" y="0" width="480" height="44" rx="20" fill="#FFFFFF" fill-opacity="0.05"/>
    <circle cx="24" cy="22" r="5.5" fill="#ED6A5E"/>
    <circle cx="42" cy="22" r="5.5" fill="#F5BF4F"/>
    <circle cx="60" cy="22" r="5.5" fill="#62C554"/>
    <text x="84" y="27" fill="#88A0A8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">xg2g pipeline // decision-engine</text>

    <!-- Code Display -->
    <g transform="translate(24, 68)" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="0" y="20" fill="#88A0A8">// Request Live Stream Session</text>
      <text x="0" y="48" fill="#5FB9E9">POST <tspan fill="#FFF8EA">/api/v3/sessions</tspan></text>
      <text x="0" y="72" fill="#88A0A8">{</text>
      <text x="20" y="96" fill="#36D1A7">"service_ref"<tspan fill="#FFF8EA">: </tspan><tspan fill="#FFB84D">"1:0:19:283D:3FB:1:C00000:0:0:0:"</tspan><tspan fill="#FFF8EA">,</tspan></text>
      <text x="20" y="120" fill="#36D1A7">"client_caps"<tspan fill="#FFF8EA">: [</tspan><tspan fill="#FFB84D">"h264"</tspan><tspan fill="#FFF8EA">, </tspan><tspan fill="#FFB84D">"aac"</tspan><tspan fill="#FFF8EA">, </tspan><tspan fill="#FFB84D">"fmp4"</tspan><tspan fill="#FFF8EA">]</tspan></text>
      <text x="0" y="144" fill="#88A0A8">}</text>

      <!-- Arrow divider -->
      <line x1="0" y1="172" x2="432" y2="172" stroke="#FFFFFF" stroke-opacity="0.1"/>

      <text x="0" y="200" fill="#88A0A8">// Decision Matrix Output</text>
      <text x="0" y="228" fill="#36D1A7">HTTP/1.1 201 Created</text>
      <text x="0" y="252" fill="#FFF8EA">mode<tspan fill="#88A0A8">: </tspan><tspan fill="#36D1A7">"video_copy_audio_transcode"</tspan></text>
      <text x="0" y="276" fill="#FFF8EA">hw_accel<tspan fill="#88A0A8">: </tspan><tspan fill="#5FB9E9">"vaapi"</tspan></text>
      <text x="0" y="300" fill="#FFF8EA">stream_url<tspan fill="#88A0A8">: </tspan><tspan fill="#FFB84D">"/api/v3/hls/sess-8f3a/master.m3u8"</tspan></text>
    </g>
  </g>
</svg>
