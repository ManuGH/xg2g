<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xg2g GitHub Hero</title>
  <desc id="desc">xg2g - self-hosted streaming gateway for Enigma2 receivers delivering live TV, adaptive streaming, and DVR to browsers and native clients.</desc>
  <defs>
    <linearGradient id="bg-hero" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050E12"/>
      <stop offset="0.5" stop-color="#0B222B"/>
      <stop offset="1" stop-color="#12313A"/>
    </linearGradient>
    <linearGradient id="signal-hero" x1="120" y1="120" x2="1160" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D1A7"/>
      <stop offset="0.5" stop-color="#5FB9E9"/>
      <stop offset="1" stop-color="#FFB84D"/>
    </linearGradient>
    <linearGradient id="panel-hero" x1="0" y1="0" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2B35" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#07181F" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow-hero" x="0" y="0" width="1280" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-hero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" rx="32" fill="url(#bg-hero)"/>

  <!-- Ambient Glow Elements -->
  <circle cx="1100" cy="130" r="260" fill="#36D1A7" fill-opacity="0.09" filter="url(#glow-hero)"/>
  <circle cx="140" cy="520" r="220" fill="#FFB84D" fill-opacity="0.08" filter="url(#glow-hero)"/>

  <!-- Dynamic Signal Wave Line -->
  <path d="M60 480C220 370 340 390 480 450C620 510 740 530 880 460C1000 400 1120 310 1220 340" stroke="url(#signal-hero)" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Main Container Card -->
  <g filter="url(#shadow-hero)">
    <rect x="56" y="56" width="1168" height="528" rx="28" fill="#07171E" fill-opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- Left Hero Column -->
  <g transform="translate(104, 108)">
    <!-- Pill Indicator -->
    <rect x="0" y="0" width="240" height="40" rx="20" fill="#36D1A7" fill-opacity="0.14" stroke="#36D1A7" stroke-opacity="0.45"/>
    <circle cx="20" cy="20" r="5" fill="#36D1A7"/>
    <text x="36" y="25" fill="#8BE9D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="2">STREAMING GATEWAY</text>

    <!-- Title & Positioning -->
    <text x="0" y="112" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">xg2g</text>
    <text x="0" y="164" fill="#FFF8EA" fill-opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Self-Hosted Enigma2 Gateway</text>
    
    <text x="0" y="212" fill="#C5D3D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Live TV, adaptive streaming, DVR and household access —</text>
    <text x="0" y="240" fill="#C5D3D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">delivered seamlessly to browsers and native clients.</text>

    <!-- Pipeline Badges Grid -->
    <g transform="translate(0, 284)">
      <rect x="0" y="0" width="168" height="54" rx="14" fill="#112F39" stroke="#36D1A7" stroke-opacity="0.35"/>
      <text x="18" y="23" fill="#36D1A7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">SOURCE</text>
      <text x="18" y="41" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Enigma2 MPEG-TS</text>

      <rect x="180" y="0" width="168" height="54" rx="14" fill="#112F39" stroke="#5FB9E9" stroke-opacity="0.35"/>
      <text x="198" y="23" fill="#5FB9E9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">TARGET</text>
      <text x="198" y="41" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">HLS &amp; fMP4</text>

      <rect x="360" y="0" width="168" height="54" rx="14" fill="#112F39" stroke="#FFB84D" stroke-opacity="0.35"/>
      <text x="378" y="23" fill="#FFB84D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">HARDWARE</text>
      <text x="378" y="41" fill="#FFF8EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">VAAPI &amp; NVENC</text>
    </g>
  </g>

  <!-- Right Hero Column: Architecture & API Window -->
  <g transform="translate(680, 108)">
    <rect x="0" y="0" width="480" height="424" rx="20" fill="url(#panel-hero)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>

    <!-- Terminal Header -->
    <rect x="0" y="0" width="480" height="44" rx="20" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="24" cy="22" r="5.5" fill="#ED6A5E"/>
    <circle cx="42" cy="22" r="5.5" fill="#F5BF4F"/>
    <circle cx="60" cy="22" r="5.5" fill="#62C554"/>
    <text x="84" y="27" fill="#88A0A8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">xg2g gateway // decision-matrix</text>

    <!-- Code Block -->
    <g transform="translate(24, 68)" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="0" y="20" fill="#88A0A8">// Start Live Streaming Session</text>
      <text x="0" y="48" fill="#5FB9E9">POST <tspan fill="#FFF8EA">/api/v3/sessions</tspan></text>
      <text x="0" y="72" fill="#88A0A8">{</text>
      <text x="20" y="96" fill="#36D1A7">"service_ref"<tspan fill="#FFF8EA">: </tspan><tspan fill="#FFB84D">"1:0:19:283D:3FB:1:C00000:0:0:0:"</tspan><tspan fill="#FFF8EA">,</tspan></text>
      <text x="20" y="120" fill="#36D1A7">"client_caps"<tspan fill="#FFF8EA">: [</tspan><tspan fill="#FFB84D">"h264"</tspan><tspan fill="#FFF8EA">, </tspan><tspan fill="#FFB84D">"aac"</tspan><tspan fill="#FFF8EA">, </tspan><tspan fill="#FFB84D">"fmp4"</tspan><tspan fill="#FFF8EA">]</tspan></text>
      <text x="0" y="144" fill="#88A0A8">}</text>

      <line x1="0" y1="172" x2="432" y2="172" stroke="#FFFFFF" stroke-opacity="0.1"/>

      <text x="0" y="200" fill="#88A0A8">// Decision Engine Pipeline Result</text>
      <text x="0" y="228" fill="#36D1A7">HTTP/1.1 201 Created</text>
      <text x="0" y="252" fill="#FFF8EA">mode<tspan fill="#88A0A8">: </tspan><tspan fill="#36D1A7">"video_copy_audio_transcode"</tspan></text>
      <text x="0" y="276" fill="#FFF8EA">hw_accel<tspan fill="#88A0A8">: </tspan><tspan fill="#5FB9E9">"vaapi"</tspan></text>
      <text x="0" y="300" fill="#FFF8EA">stream_url<tspan fill="#88A0A8">: </tspan><tspan fill="#FFB84D">"/api/v3/hls/sess-8f3a/master.m3u8"</tspan></text>
    </g>
  </g>
</svg>
